<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f10" />
    <title>Scan to PDF</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='6' y='3' width='20' height='26' rx='3' fill='%23ededee'/%3E%3Cpath d='M10 11h12M10 16h12M10 21h7' stroke='%230f0f10' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="scanner" id="scanner">
      <aside class="pages" aria-label="Scanned pages">
        <header class="pages-header">
          <span class="pages-title">Pages</span>
          <span class="count" id="page-count">0</span>
        </header>
        <ol class="page-list" id="page-list"></ol>
        <p class="pages-empty" id="pages-empty">Scanned pages will show up here.</p>
        <footer class="pages-footer">
          <button class="btn btn-primary" id="export" disabled>Export PDF</button>
        </footer>
      </aside>

      <div class="status" id="status" data-state="idle" role="status" aria-live="polite">
        <div class="status-fill" id="status-fill"></div>
        <span class="status-label" id="status-label">Ready</span>
      </div>

      <section class="stage" id="stage">
        <video id="video" playsinline muted></video>
        <canvas class="overlay" id="overlay"></canvas>
        <div class="flash" id="flash"></div>

        <div class="stage-message" id="stage-message" hidden>
          <p id="stage-message-text"></p>
          <button class="btn" id="retry">Try again</button>
        </div>

        <div class="controls" id="controls" hidden>
          <label class="toggle">
            <input type="checkbox" id="auto" checked />
            <span class="toggle-track" aria-hidden="true"></span>
            <span>Auto</span>
          </label>
          <button class="shutter" id="shutter" aria-label="Capture page now"></button>
          <span></span>
        </div>

        <div class="preview" id="preview" hidden>
          <div class="preview-bar">
            <button class="btn btn-ghost" id="back">
              <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              Camera
            </button>
            <span class="preview-title" id="preview-title"></span>
            <span class="preview-actions">
              <button class="btn btn-ghost" id="rotate">
                <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
                  <path d="M13 8a5 5 0 1 1-1.46-3.54M13 2.5v2.5h-2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
                Rotate
              </button>
              <button class="btn btn-ghost btn-danger" id="delete">Delete</button>
            </span>
          </div>
          <div class="preview-body">
            <img id="preview-img" alt="" />
          </div>
        </div>
      </section>
    </main>

    <div class="welcome" id="welcome">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="welcome-title">
        <h1 id="welcome-title">Scan to PDF</h1>
        <p class="dialog-sub">What would you like to do?</p>
        <div class="choices">
          <button class="choice" id="choose-scan">
            <span class="choice-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 20 20">
                <path
                  d="M2.75 6.5V4.25c0-.83.67-1.5 1.5-1.5H6.5M13.5 2.75h2.25c.83 0 1.5.67 1.5 1.5V6.5M17.25 13.5v2.25c0 .83-.67 1.5-1.5 1.5H13.5M6.5 17.25H4.25c-.83 0-1.5-.67-1.5-1.5V13.5M2.75 10h14.5"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="choice-text">
              <span class="choice-title">Scan pages</span>
              <span class="choice-desc">Hold pages up to your camera. Each one is captured automatically and saved to a PDF.</span>
            </span>
            <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true">
              <path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
          <button class="choice" id="choose-other" disabled>
            <span class="choice-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 20 20">
                <rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.5" />
              </svg>
            </span>
            <span class="choice-text">
              <span class="choice-title">Lorem ipsum</span>
              <span class="choice-desc">Dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor.</span>
            </span>
            <span class="badge">Soon</span>
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
